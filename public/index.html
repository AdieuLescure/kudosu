<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Wiki Duel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232f5bea%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3EW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">

<body>
  <header class="top">
    <a class="brand" href="#/">Wiki<span>Duel</span></a>
    <nav id="nav">
      <a href="#/duel" data-tab="duel">Duel</a>
      <a href="#/tierlist" data-tab="tierlist">Tier list</a>
      <a href="#/historique" data-tab="historique">Historique</a>
    </nav>
    <div class="who">
      <span id="who-name"></span>
      <button id="who-change" class="link" type="button">changer</button>
    </div>
  </header>

  <main id="view"></main>

  <div id="gate" class="gate" hidden>
    <form id="gate-form" class="gate-box" autocomplete="off">
      <h1>Bienvenue !</h1>
      <p>Comment tu t'appelles ? Ce pseudo sera visible par les autres joueurs.</p>
      <input id="gate-input" type="text" maxlength="20" placeholder="Ton pseudo" required>
      <button type="submit" class="btn primary">Entrer</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script src="duel.js"></script>
  <script src="tierlist.js"></script>
  <script src="history.js"></script>
  <script>App.start();</script>
</body>
</html>
